project: FoliaNet
seed: 42

data:
  # Folder with one subfolder per class.
  root: data/crop_images
  # Only use folders with these crop names.
  crops: ["Corn", "Wheat"]
  img_size: 224
  val_split: 0.15
  batch_size: 32
  num_workers: 4

model:
  backbone: efficientnet_b0    # or "resnet18"
  pretrained: true
  # Keep at 0. Extra inputs aren't hooked up yet.
  tabular_dim: 0
  dropout: 0.3

train:
  epochs: 15
  lr: 0.0003
  weight_decay: 0.0001
  checkpoint_dir: checkpoints

# How much the image vs weather counts. Not read yet (the predictor
# has the same numbers built in).
fusion:
  image_weight: 0.6
  env_weight: 0.4

inference:
  checkpoint: checkpoints/folianet_best.pt
