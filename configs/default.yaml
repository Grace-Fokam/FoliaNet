project: FoliaNet
seed: 42

data:
  # Folder containing one image folder for each disease or healthy class.
  root: data/crop_images
  # Only include image folders with these crop names.
  crops: ["Corn", "Wheat"]
  img_size: 224
  val_split: 0.15
  batch_size: 32
  num_workers: 4

model:
  backbone: efficientnet_b0    # or "resnet18"
  pretrained: true
  # Keep this at 0. The current trainer and predictor only pass images.
  tabular_dim: 0
  dropout: 0.3

train:
  epochs: 15
  lr: 0.0003
  weight_decay: 0.0001
  checkpoint_dir: checkpoints

# Default weights for combining image and weather scores.
# The current predictor uses its own defaults; it does not read this section.
fusion:
  image_weight: 0.6
  env_weight: 0.4

inference:
  checkpoint: checkpoints/folianet_best.pt
